<!DOCTYPE html> 
<html lang="es"> 
<head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesion - Sistema de Gestion</title>  
<link rel="stylesheet" href="style.css" />  
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>
<body class="bg-light">  
<main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">    
<div class="card shadow" style="max-width: 400px; width: 100%;">      
<div class="card-body p-4">        
<h1 class="h4 text-center mb-4">Sistema de Gestion</h1>        
<div id="login-error" class="alert alert-danger d-none"></div>        
<form id="login-form" novalidate>          
<div class="mb-3">            
<label for="login-email" class="form-label">Correo electronico</label>            
<input type="email" id="login-email" class="form-control" required />        
 </div>          
 <div class="mb-3">            
<label for="login-password" class="form-label">Contrasena</label>           
 <input type="password" id="login-password" class="form-control" required />      
    </div>         
     <button type="submit" class="btn btn-primary w-100">Iniciar sesion</button>      
      </form>    
      </div>  
      </div> 
     </main> 
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min. js"></script>
        <script src="app.js"></script> 
    </body>
     </html>
