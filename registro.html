<!DOCTYPE html>
<html lang="es">
<!-- revisado por Abimilet Peralta Grullon - 100081397 -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Abimilet Peralta Grullon - 100081397" />
  <title>Registro — Sistema de Gestion</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        Sistema de Gestion
      </a>

      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="registro.html">Registrar</a>

        <button id="btn-logout" class="btn btn-outline-light btn-sm ms-3">
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2>Registro de Datos</h2>

    <form id="registroForm" novalidate>

      <fieldset>
        <legend>Información Personal</legend>

        <fieldset class="card p-3 mb-3">
          <legend>Información Personal</legend>

          <p>
            <label for="nombre" class="form-label">Nombre <abbr title="requerido">*</abbr></label>
            <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Ej: Ana" required
              autocomplete="given-name" />
          </p>

          <p>
            <label for="apellido" class="form-label">Apellido <abbr title="requerido">*</abbr></label>
            <input class="form-control" type="text" id="apellido" name="apellido" placeholder="Ej: Martínez" required
              autocomplete="family-name" />
          </p>

          <p>
            <label for="cedula" class="form-label">Cédula <abbr title="requerido">*</abbr></label>
            <input class="form-control" type="text" id="cedula" name="cedula" placeholder="000-0000000-0" required
              inputmode="numeric" />
            <small class="form-text text-muted">Formato: 000-0000000-0</small>
          </p>

          <p>
            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
            <input class="form-control" type="date" id="fecha_nacimiento" name="fecha_nacimiento" max="2008-01-01" />
            <small class="form-text text-muted">Debe ser mayor de 18 años.</small>
          </p>

          <p>
            <label for="genero" class="form-label">Género</label>
            <select class="form-select" id="genero" name="genero">
              <option value="" disabled selected>Seleccionar…</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="O">Otro</option>
              <option value="NE">Prefiero no indicar</option>
            </select>
          </p>

          <p>
            <label for="telefono" class="form-label">Teléfono</label>
            <input class="form-control" type="tel" id="telefono" name="telefono" placeholder="809-000-0000"
              autocomplete="tel" />
          </p>

          <p>
            <label for="estado" class="form-label">Estado <abbr title="requerido">*</abbr></label>
            <select class="form-select" id="estado" name="estado" required>
              <option value="" disabled selected>Seleccionar…</option>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
              <option value="pendiente">Pendiente</option>
            </select>
          </p>
        </fieldset>

        <fieldset class="card p-3 mb-3">
          <legend>Contacto y Ubicación</legend>

          <p>
            <label for="email" class="form-label">Correo Electrónico <abbr title="requerido">*</abbr></label>
            <input class="form-control" type="email" id="email" name="email" placeholder="correo@ejemplo.com" required
              autocomplete="email" />
          </p>

          <p>
            <label for="provincia" class="form-label">Provincia</label>
            <select class="form-select" id="provincia" name="provincia">
              <option value="" disabled selected>Seleccionar…</option>
              <option value="SD">Santo Domingo</option>
              <option value="STG" selected>Santiago</option>
              <option value="LV">La Vega</option>
              <option value="SPM">San Pedro de Macorís</option>
              <option value="OTR">Otra</option>
            </select>
          </p>

          <p>
            <label for="direccion" class="form-label">Dirección</label>
            <textarea class="form-control" id="direccion" name="direccion" rows="3"
              placeholder="Calle, número, sector…"></textarea>
          </p>
        </fieldset>

        <fieldset class="card p-3 mb-3">
          <legend>Clasificación</legend>

          <p>
            <label for="categoria" class="form-label">Categoría <abbr title="requerido">*</abbr></label>
            <select class="form-select" id="categoria" name="categoria" required>
              <option value="" disabled selected>Seleccionar…</option>
              <option value="A">Tipo A — Prioritario</option>
              <option value="B">Tipo B — Estándar</option>
              <option value="C">Tipo C — Secundario</option>
            </select>
          </p>

          <p>
            <label for="observaciones" class="form-label">Observaciones</label>
            <textarea class="form-control" id="observaciones" name="observaciones" rows="3" maxlength="500"
              placeholder="Notas adicionales…"></textarea>
            <small class="form-text text-muted">
              Caracteres restantes: <span id="contador">500</span>
            </small>
          </p>
        </fieldset>

        <p class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="consentimiento" name="consentimiento" required />
          <label class="form-check-label" for="consentimiento">
            Confirmo que los datos son correctos y acepto los <a href="#">Términos de Uso</a>.
          </label>
        </p>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            Guardar
          </button>

          <button type="reset" class="btn btn-secondary">
            Limpiar
          </button>
        </div>
    </form>
  </main>

  <footer>
    <p>© 2026 Sistema de Gestion — Etapa 1</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
